<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Defesa Litorânea - Comando Operacional</title>
    <style>
        body { margin: 0; overflow: hidden; background: #000; color: #0f0; font-family: 'Courier New', monospace; }
        #hud { position: absolute; top: 20px; left: 20px; border: 2px solid #0f0; padding: 15px; background: rgba(0,10,0,0.9); pointer-events: none; }
        #crosshair { position: absolute; top: 50%; left: 50%; width: 25px; height: 25px; border: 2px solid #f00; transform: translate(-50%, -50%); border-radius: 50%; display: none; z-index: 5; }
        #instrucoes { position: absolute; bottom: 20px; width: 100%; text-align: center; color: #fff; font-size: 14px; }
    </style>
</head>
<body>

<div id="hud">
    <div style="font-weight: bold;">COMANDO DE DEFESA LITORÂNEA</div>
    <hr>
    <div>STATUS: <span id="status">PATRULHANDO (FPS)</span></div>
    <div>ALVOS: <span id="inimigos">0</span></div>
</div>
<div id="crosshair"></div>
<div id="instrucoes">[W,A,S,D] ANDAR | [MOUSE] OLHAR | [E] OPERAR ARMA</div>

<script type="importmap">
    { "imports": { "three": "https://unpkg.com/three@0.160.0/build/three.module.js" } }
</script>

<script type="module">
    import * as THREE from 'three';
    import { GLTFLoader } from 'https://unpkg.com/three@0.160.0/examples/jsm/loaders/GLTFLoader.js';
    import { OBJLoader } from 'https://unpkg.com/three@0.160.0/examples/jsm/loaders/OBJLoader.js';
    import { MTLLoader } from 'https://unpkg.com/three@0.160.0/examples/jsm/loaders/MTLLoader.js';
    import { PointerLockControls } from 'https://unpkg.com/three@0.160.0/examples/jsm/controls/PointerLockControls.js';

    // ==========================================
    // ÁREA DE CONFIGURAÇÃO (DEFINA AS POSIÇÕES AQUI)
    // ==========================================
    const CONFIG_DEFESA = {
        minhaArma: { x: 0, z: -10 },
        aliados: [
            { x: 80, z: -20 },  // Posição Aliado Direita
            { x: -80, z: -20 }  // Posição Aliado Esquerda
        ],
        personagemSpawn: { x: 0, y: -4.5, z: 20 },
        ondas: { qtd: 15, velocidade: 2.0 }
    };

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x000205); // Céu Noturno
    scene.fog = new THREE.FogExp2(0x000205, 0.005);

    const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 3000);
    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    document.body.appendChild(renderer.domElement);

    // ILUMINAÇÃO (LUZ DA LUA)
    const moonlight = new THREE.DirectionalLight(0xaabbff, 0.8);
    moonlight.position.set(50, 100, 50);
    scene.add(moonlight);
    scene.add(new THREE.AmbientLight(0x404040, 0.5));

    // CRIAÇÃO DA PRAIA (CHÃO)
    const sandGeo = new THREE.PlaneGeometry(2000, 2000);
    const sandMat = new THREE.MeshStandardMaterial({ color: 0xc2b280, roughness: 0.8 }); // Areia
    const beach = new THREE.Mesh(sandGeo, sandMat);
    beach.rotation.x = -Math.PI / 2;
    beach.position.y = -5.1;
    scene.add(beach);

    // CONTROLES E PERSONAGEM
    const controls = new PointerLockControls(camera, document.body);
    let moveForward = false, moveBackward = false, moveLeft = false, moveRight = false;
    let velocity = new THREE.Vector3();
    let direction = new THREE.Vector3();
    let isOperating = false;

    // CARREGADORES
    const gltfLoader = new GLTFLoader();
    const mtlLoader = new MTLLoader();
    const objLoader = new OBJLoader();

    let myTurret, turretPivot;
    let militaryMan, soldierBody; // Referências do personagem 3D
    let enemies = [];

    // 1. CARREGAR CENÁRIO (STAGE DESIGN)
    mtlLoader.load('./stage design.mtl', (mtl) => {
        mtl.preload();
        objLoader.setMaterials(mtl).load('./stage design.obj', (obj) => {
            obj.scale.set(0.4, 0.4, 0.4);
            obj.position.y = -5;
            scene.add(obj);
        });
    });

    // 2. CARREGAR MILITARY MAN (SEU PERSONAGEM)
    gltfLoader.load('./Military man.glb', (gltf) => {
        militaryMan = gltf.scene;
        militaryMan.scale.set(3, 3, 3);
        militaryMan.position.set(CONFIG_DEFESA.personagemSpawn.x, CONFIG_DEFESA.personagemSpawn.y, CONFIG_DEFESA.personagemSpawn.z);
        scene.add(militaryMan);
        soldierBody = militaryMan;
    });

    // 3. FUNÇÃO PARA CRIAR ARMAS
    function spawnTurret(x, z, isPlayer) {
        gltfLoader.load('./Missile Turret.glb', (gltf) => {
            const base = gltf.scene;
            base.position.set(x, -5, z);
            base.scale.set(4, 4, 4);
            
            const pivot = new THREE.Group();
            pivot.position.y = 4;
            base.add(pivot);

            if(isPlayer) {
                myTurret = base;
                turretPivot = pivot;
            } else {
                base.userData.isAlly = true;
            }
            scene.add(base);
        });
    }

    spawnTurret(CONFIG_DEFESA.minhaArma.x, CONFIG_DEFESA.minhaArma.z, true);
    CONFIG_DEFESA.aliados.forEach(p => spawnTurret(p.x, p.z, false));

    // LOGICA DE TECLAS E ENTRADA
    document.addEventListener('click', () => { if(!isOperating) controls.lock(); });

    window.addEventListener('keydown', (e) => {
        if(e.code === 'KeyE') {
            isOperating = !isOperating;
            if(isOperating && myTurret) {
                controls.unlock();
                document.getElementById('status').innerText = "OPERANDO ARMA (FPS)";
                document.getElementById('crosshair').style.display = 'block';
                if(soldierBody) soldierBody.visible = false; // Esconde o corpo ao entrar
            } else {
                controls.lock();
                document.getElementById('status').innerText = "PATRULHANDO (FPS)";
                document.getElementById('crosshair').style.display = 'none';
                if(soldierBody) {
                    soldierBody.visible = true; // Mostra o corpo ao sair
                    // Posiciona o soldado atrás da arma
                    const turretOffset = new THREE.Vector3(0, 0.5, 8).applyMatrix4(myTurret.matrixWorld);
                    soldierBody.position.copy(turretOffset);
                }
            }
        }
        switch (e.code) {
            case 'KeyW': moveForward = true; break;
            case 'KeyA': moveLeft = true; break;
            case 'KeyS': moveBackward = true; break;
            case 'KeyD': moveRight = true; break;
        }
    });

    window.addEventListener('keyup', (e) => {
        switch (e.code) {
            case 'KeyW': moveForward = false; break;
            case 'KeyA': moveLeft = false; break;
            case 'KeyS': moveBackward = false; break;
            case 'KeyD': moveRight = false; break;
        }
    });

    // LOOP DE ANIMAÇÃO
    let prevTime = performance.now();
    function animate() {
        requestAnimationFrame(animate);
        const time = performance.now();
        const delta = (time - prevTime) / 1000;

        // Se estiver operando a arma, a câmera trava nela
        if (isOperating && myTurret) {
            const camPos = new THREE.Vector3(0, 10, 0).applyMatrix4(myTurret.matrixWorld);
            camera.position.lerp(camPos, 0.1);
        } else {
            // Movimentação do Personagem
            velocity.x -= velocity.x * 10.0 * delta;
            velocity.z -= velocity.z * 10.0 * delta;

            direction.z = Number(moveForward) - Number(moveBackward);
            direction.x = Number(moveRight) - Number(moveLeft);
            direction.normalize();

            if (moveForward || moveBackward) velocity.z -= direction.z * 400.0 * delta;
            if (moveLeft || moveRight) velocity.x -= direction.x * 400.0 * delta;

            if (soldierBody && controls.isLocked) {
                controls.moveRight(-velocity.x * delta);
                controls.moveForward(-velocity.z * delta);
                
                // Sincroniza o modelo 3D com a câmera
                militaryMan.position.copy(camera.position);
                militaryMan.position.y = CONFIG_DEFESA.personagemSpawn.y;
                militaryMan.rotation.y = camera.rotation.y + Math.PI; // Ajuste para o soldado olhar para frente
            }
        }

        renderer.render(scene, camera);
        prevTime = time;
    }
    animate();
</script>
</body>
</html>
