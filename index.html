<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Defesa Litorânea - Versão Corrigida</title>
    <style>
        body { margin: 0; overflow: hidden; background: #000; }
        #hud { position: absolute; top: 20px; left: 20px; color: #0f0; font-family: monospace; background: rgba(0,0,0,0.7); padding: 10px; border: 1px solid #0f0; }
        #crosshair { position: absolute; top: 50%; left: 50%; width: 20px; height: 20px; border: 2px solid #f00; border-radius: 50%; transform: translate(-50%, -50%); display: none; }
    </style>
</head>
<body>

<div id="hud">
    <div>MODO: <span id="modo">SOLDADO (3ª PESSOA)</span></div>
    <div>TECLAS: [W,A,S,D] ANDAR | [E] USAR ARMA | [CLIQUE] ATIRAR</div>
</div>
<div id="crosshair"></div>

<script type="importmap">
    { "imports": { "three": "https://unpkg.com/three@0.160.0/build/three.module.js" } }
</script>

<script type="module">
    import * as THREE from 'three';
    import { GLTFLoader } from 'https://unpkg.com/three@0.160.0/examples/jsm/loaders/GLTFLoader.js';
    import { OBJLoader } from 'https://unpkg.com/three@0.160.0/examples/jsm/loaders/OBJLoader.js';
    import { MTLLoader } from 'https://unpkg.com/three@0.160.0/examples/jsm/loaders/MTLLoader.js';

    // 1. CONFIGURAÇÃO DE ONDE CADA COISA VAI FICAR
    const CONFIG = {
        minhaArma: { x: 0, y: -5, z: -10 },
        aliados: [
            { x: 60, y: -5, z: -20 },
            { x: -60, y: -5, z: -20 }
        ],
        pessoal: { x: 0, y: -5, z: 20 }
    };

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x000205); // Céu Noite
    const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 2000);
    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    document.body.appendChild(renderer.domElement);

    // Iluminação
    scene.add(new THREE.AmbientLight(0xffffff, 0.5));
    const luzLuar = new THREE.DirectionalLight(0xffffff, 1);
    luzLuar.position.set(10, 50, 10);
    scene.add(luzLuar);

    // Praia
    const areia = new THREE.Mesh(new THREE.PlaneGeometry(1000, 1000), new THREE.MeshStandardMaterial({color: 0xc2b280}));
    areia.rotation.x = -Math.PI/2;
    areia.position.y = -5.05;
    scene.add(areia);

    const loader = new GLTFLoader();
    const objLoader = new OBJLoader();
    const mtlLoader = new MTLLoader();

    let soldado, armaPrincipal, firePoint;
    let operando = false;
    let balas = [];
    let teclado = {};

    // CARREGAR SOLDADO
    loader.load('./Military man.glb', (gltf) => {
        soldado = gltf.scene;
        soldado.scale.set(3, 3, 3);
        soldado.position.set(CONFIG.pessoal.x, CONFIG.pessoal.y, CONFIG.pessoal.z);
        scene.add(soldado);
    });

    // CARREGAR ARMA (COM PONTO DE TIRO)
    loader.load('./Missile Turret.glb', (gltf) => {
        armaPrincipal = gltf.scene;
        armaPrincipal.scale.set(4, 4, 4);
        armaPrincipal.position.set(CONFIG.minhaArma.x, CONFIG.minhaArma.y, CONFIG.minhaArma.z);
        
        // Criar o ponto de onde sai a bala
        firePoint = new THREE.Group();
        firePoint.position.set(0, 5, -5); // Ajustado para a ponta do canhão
        armaPrincipal.add(firePoint);
        
        scene.add(armaPrincipal);
    });

    // CENÁRIO OBJ
    mtlLoader.load('./stage design.mtl', (mtl) => {
        mtl.preload();
        objLoader.setMaterials(mtl).load('./stage design.obj', (obj) => {
            obj.scale.set(0.5, 0.5, 0.5);
            obj.position.y = -5;
            scene.add(obj);
        });
    });

    // EVENTOS
    window.addEventListener('keydown', (e) => { 
        teclado[e.code] = true;
        if(e.code === 'KeyE') {
            operando = !operando;
            document.getElementById('modo').innerText = operando ? "NA TURRET" : "SOLDADO (3ª PESSOA)";
            document.getElementById('crosshair').style.display = operando ? "block" : "none";
        }
    });
    window.addEventListener('keyup', (e) => teclado[e.code] = false);

    // DISPARAR
    window.addEventListener('mousedown', () => {
        if(operando && armaPrincipal) {
            const bala = new THREE.Mesh(new THREE.SphereGeometry(0.4), new THREE.MeshBasicMaterial({color: 0x00ff00}));
            bala.position.setFromMatrixPosition(firePoint.matrixWorld);
            
            const direcao = new THREE.Vector3(0, 0, -1).applyQuaternion(armaPrincipal.quaternion);
            balas.push({ mesh: bala, vel: direcao.multiplyScalar(6) });
            scene.add(bala);
        }
    });

    function animate() {
        requestAnimationFrame(animate);

        if(soldado && !operando) {
            // MOVIMENTO 3ª PESSOA
            if(teclado['KeyW']) soldado.translateZ(0.4);
            if(teclado['KeyS']) soldado.translateZ(-0.4);
            if(teclado['KeyA']) soldado.rotation.y += 0.04;
            if(teclado['KeyD']) soldado.rotation.y -= 0.04;

            // Câmara atrás do soldado
            const dist = new THREE.Vector3(0, 15, -35).applyQuaternion(soldado.quaternion);
            camera.position.lerp(soldado.position.clone().add(dist), 0.1);
            camera.lookAt(soldado.position.x, soldado.position.y + 10, soldado.position.z);
        }

        if(operando && armaPrincipal) {
            // CONTROLE DA ARMA
            if(teclado['KeyA']) armaPrincipal.rotation.y += 0.03;
            if(teclado['KeyD']) armaPrincipal.rotation.y -= 0.03;

            // Câmara na mira
            const alvoMira = new THREE.Vector3(0, 12, 0).applyMatrix4(armaPrincipal.matrixWorld);
            camera.position.lerp(alvoMira, 0.1);
            camera.lookAt(new THREE.Vector3(0, 10, -100).applyMatrix4(armaPrincipal.matrixWorld));
        }

        // MOVER BALAS
        balas.forEach((b, i) => {
            b.mesh.position.add(b.vel);
            if(b.mesh.position.z < -1000) {
                scene.remove(b.mesh);
                balas.splice(i, 1);
            }
        });

        renderer.render(scene, camera);
    }
    animate();
</script>
</body>
</html>
