<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Defesa Litorânea - Modo Rajada</title>
    <style>
        body { margin: 0; overflow: hidden; background: #000; color: #0f0; font-family: monospace; }
        #hud { position: absolute; top: 20px; left: 20px; border: 1px solid #0f0; padding: 10px; background: rgba(0,0,0,0.8); z-index: 10; }
        #crosshair { 
            position: absolute; top: 50%; left: 50%; width: 30px; height: 30px; 
            border: 2px solid #f00; border-radius: 50%; transform: translate(-50%, -50%); 
            display: none; pointer-events: none;
        }
    </style>
</head>
<body>

<div id="hud">
    <div>SISTEMA DE ARMAS: ONLINE</div>
    <hr>
    <div>TRAVAR MOUSE: [TECLA 1]</div>
    <div>TIRO: [CLIQUE] | RAJADA: [SEGURAR]</div>
    <div>INIMIGOS ABAIXO DO LIMITE: SIM</div>
</div>
<div id="crosshair"></div>

<script type="importmap">
    { "imports": { "three": "https://unpkg.com/three@0.160.0/build/three.module.js" } }
</script>

<script type="module">
    import * as THREE from 'three';
    import { GLTFLoader } from 'https://unpkg.com/three@0.160.0/examples/jsm/loaders/GLTFLoader.js';

    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 2000);
    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    document.body.appendChild(renderer.domElement);

    // Audio Setup
    const listener = new THREE.AudioListener();
    camera.add(listener);
    const shotSound = new THREE.Audio(listener);
    const audioLoader = new THREE.AudioLoader();
    audioLoader.load('./shot.mp3', (buffer) => {
        shotSound.setBuffer(buffer);
        shotSound.setVolume(0.5);
    });

    scene.add(new THREE.AmbientLight(0xffffff, 0.4));
    const light = new THREE.DirectionalLight(0xaabbff, 1.5);
    light.position.set(50, 100, 50);
    scene.add(light);

    const loader = new GLTFLoader();
    let soldier, myTurret, firePoint, mixer;
    let isOperating = false;
    let isShooting = false;
    let lastBurstTime = 0;
    let yaw = 0, pitch = 0;
    let enemies = [], bullets = [], enemyMissiles = [], keys = {};

    // 1. Carregar Soldado
    loader.load('./Military man.glb', (gltf) => {
        soldier = gltf.scene;
        soldier.scale.set(3.5, 3.5, 3.5);
        soldier.position.set(0, -5, 0);
        scene.add(soldier);
        if(gltf.animations.length > 0) {
            mixer = new THREE.AnimationMixer(soldier);
            mixer.clipAction(gltf.animations[0]).play();
        }
    });

    // 2. Carregar Turret
    loader.load('./Missile Turret.glb', (gltf) => {
        myTurret = gltf.scene;
        myTurret.scale.set(4, 4, 4);
        myTurret.position.set(0, -5, -15);
        firePoint = new THREE.Group();
        firePoint.position.set(0, 5, -10);
        myTurret.add(firePoint);
        scene.add(myTurret);
    });

    // 3. IA de Inimigos (Ataque e Volta)
    function spawnEnemy() {
        loader.load('./airplane.glb', (gltf) => {
            const enemy = gltf.scene;
            enemy.scale.set(6, 6, 6);
            // Altura corrigida para ficar na mira
            enemy.position.set(Math.random() * 400 - 200, 15 + Math.random() * 10, -800);
            scene.add(enemy);
            enemies.push({ mesh: enemy, lastShot: 0 });
        });
    }
    for(let i=0; i<6; i++) spawnEnemy();

    // Controles de Disparo
    window.addEventListener('mousedown', () => { isShooting = true; });
    window.addEventListener('mouseup', () => { isShooting = false; });

    function fire() {
        if (!isOperating || !myTurret) return;
        
        // Tocar Som
        if (shotSound.isPlaying) shotSound.stop();
        shotSound.play();

        const b = new THREE.Mesh(new THREE.SphereGeometry(0.6), new THREE.MeshBasicMaterial({color: 0x00ff00}));
        b.position.setFromMatrixPosition(firePoint.matrixWorld);
        const dir = new THREE.Vector3(0, 0, -1).applyQuaternion(myTurret.quaternion);
        bullets.push({ mesh: b, vel: dir.multiplyScalar(15) });
        scene.add(b);
    }

    window.addEventListener('keydown', (e) => {
        if (e.key === '1') renderer.domElement.requestPointerLock();
        if (e.code === 'KeyE') {
            isOperating = !isOperating;
            document.getElementById('crosshair').style.display = isOperating ? 'block' : 'none';
        }
        keys[e.code] = true;
    });
    window.addEventListener('keyup', (e) => keys[e.code] = false);

    document.addEventListener('mousemove', (e) => {
        if (document.pointerLockElement === renderer.domElement) {
            yaw -= e.movementX * 0.002;
            pitch -= e.movementY * 0.002;
        }
    });

    const clock = new THREE.Clock();

    function animate() {
        requestAnimationFrame(animate);
        const delta = clock.getDelta();
        const time = clock.getElapsedTime();
        if (mixer) mixer.update(delta);

        // Lógica de Rajada (Se segurar o mouse, atira a cada 0.1s)
        if (isShooting && time - lastBurstTime > 0.1) {
            fire();
            lastBurstTime = time;
        }

        if (soldier && !isOperating) {
            soldier.rotation.y = yaw;
            if (keys['KeyW']) soldier.translateZ(0.25);
            if (keys['KeyS']) soldier.translateZ(-0.2);
            const camPos = new THREE.Vector3(6, 14, -28).applyQuaternion(soldier.quaternion);
            camera.position.lerp(soldier.position.clone().add(camPos), 0.1);
            camera.lookAt(soldier.position.x, soldier.position.y + 10, soldier.position.z);
        }

        if (isOperating && myTurret) {
            myTurret.rotation.y = yaw;
            camera.position.copy(new THREE.Vector3(0, 13, 5).applyMatrix4(myTurret.matrixWorld));
            camera.lookAt(new THREE.Vector3(0, 10 + (pitch * 60), -100).applyMatrix4(myTurret.matrixWorld));
        }

        // IA: Aviões atacam e voltam
        enemies.forEach((en) => {
            en.mesh.position.z += 2.5; 
            if (time - en.lastShot > 3 && en.mesh.position.z < -50) {
                const m = new THREE.Mesh(new THREE.CylinderGeometry(0.2, 0.2, 2), new THREE.MeshBasicMaterial({color: 0xff0000}));
                m.position.copy(en.mesh.position);
                enemyMissiles.push({ mesh: m, vel: new THREE.Vector3(0, 0, 4) });
                scene.add(m);
                en.lastShot = time;
            }
            if (en.mesh.position.z > 150) { // Volta para o início para atacar de novo
                en.mesh.position.z = -800;
                en.mesh.position.x = Math.random() * 400 - 200;
            }
        });

        // Balas e Colisões
        bullets.forEach((b, bi) => {
            b.mesh.position.add(b.vel);
            enemies.forEach((en) => {
                if (b.mesh.position.distanceTo(en.mesh.position) < 18) {
                    en.mesh.position.z = -800; // Avião "abatido" volta pro fundo
                    scene.remove(b.mesh);
                    bullets.splice(bi, 1);
                }
            });
        });

        renderer.render(scene, camera);
    }
    animate();
</script>
</body>
</html>
