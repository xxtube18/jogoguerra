<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Comando de Defesa - Versão Final</title>
    <style>
        body { margin: 0; overflow: hidden; background: #000; color: #0f0; font-family: 'Courier New', monospace; }
        #hud { position: absolute; top: 20px; left: 20px; border: 1px solid #0f0; padding: 15px; background: rgba(0,20,0,0.8); pointer-events: none; }
        #crosshair { position: absolute; top: 50%; left: 50%; width: 25px; height: 25px; border: 2px solid #0f0; transform: translate(-50%, -50%); border-radius: 50%; display: none; }
        .config-info { color: #88ff88; font-size: 12px; }
    </style>
</head>
<body>

<div id="hud">
    <div style="font-size: 20px; font-weight: bold;">SISTEMA DE DEFESA ATIVO</div>
    <hr>
    <div>MODO: <span id="modo">OBSERVADOR</span></div>
    <div>ALVOS NA ONDA: <span id="alvos">0</span></div>
    <div class="config-info">Aperte [E] para Operar | [Mouse] Mira 360º | [Clique] Fogo</div>
</div>
<div id="crosshair"></div>

<script type="importmap">
    { "imports": { "three": "https://unpkg.com/three@0.160.0/build/three.module.js" } }
</script>

<script type="module">
    import * as THREE from 'three';
    import { GLTFLoader } from 'https://unpkg.com/three@0.160.0/examples/jsm/loaders/GLTFLoader.js';
    import { OBJLoader } from 'https://unpkg.com/three@0.160.0/examples/jsm/loaders/OBJLoader.js';
    import { MTLLoader } from 'https://unpkg.com/three@0.160.0/examples/jsm/loaders/MTLLoader.js';

    // ==========================================
    // ÁREA DE CONFIGURAÇÃO (MUDA AQUI O TEU JOGO)
    // ==========================================
    const MEU_JOGO = {
        posicaoAliados: [
            { x: 60, z: -30 },  // Aliado da direita
            { x: -60, z: -30 }  // Aliado da esquerda
        ],
        ondas: [
            { avioes: 8, velocidade: 1.8 }, // Onda 1
            { avioes: 20, velocidade: 2.5 } // Onda 2
        ]
    };

    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 2000);
    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    document.body.appendChild(renderer.domElement);

    const light = new THREE.AmbientLight(0xffffff, 1.5);
    scene.add(light);
    const sun = new THREE.DirectionalLight(0xffffff, 1);
    sun.position.set(50, 100, 50);
    scene.add(sun);

    let playerBase, playerCannon; // Base gira lados, Cannon gira cima/baixo
    let isControlling = false;
    let enemies = [];
    let bullets = [];
    let currentWave = 0;

    const gltfLoader = new GLTFLoader();
    const mtlLoader = new MTLLoader();
    const objLoader = new OBJLoader();

    // 1. CARREGAR CENÁRIO (Ficheiros soltos na raiz)
    mtlLoader.load('./stage design.mtl', (materials) => {
        materials.preload();
        objLoader.setMaterials(materials).load('./stage design.obj', (obj) => {
            obj.scale.set(0.6, 0.6, 0.6);
            obj.position.y = -5;
            scene.add(obj);
        });
    });

    // 2. FUNÇÃO PARA CRIAR ARMAS (MIRA 3D COMPLETA)
    function spawnWeapon(x, z, isPlayer) {
        gltfLoader.load('./Missile Turret.glb', (gltf) => {
            const base = gltf.scene;
            base.position.set(x, -2, z);
            base.scale.set(3, 3, 3);
            
            // Criar um "Eixo" invisível para a arma olhar para cima e baixo
            const cannonPivot = new THREE.Group();
            cannonPivot.position.y = 3; 
            base.add(cannonPivot);
            
            if (isPlayer) {
                playerBase = base;
                playerCannon = cannonPivot;
            } else {
                base.userData.isAlly = true;
                base.userData.pivot = cannonPivot;
            }
            scene.add(base);
        });
    }

    // Criar as armas conforme a tua configuração
    spawnWeapon(0, 0, true); // Tu
    MEU_JOGO.posicaoAliados.forEach(p => spawnWeapon(p.x, p.z, false)); // Aliados

    // SISTEMA DE TIRO (Saindo da ponta da mira)
    function fire(base, pivot) {
        const bullet = new THREE.Mesh(
            new THREE.SphereGeometry(0.5),
            new THREE.MeshBasicMaterial({ color: 0x00ff00 })
        );
        
        // Pega a posição exata de onde a arma está apontando
        const vector = new THREE.Vector3(0, 0, -1);
        vector.applyQuaternion(pivot.quaternion);
        vector.applyQuaternion(base.quaternion);
        
        bullet.position.setFromMatrixPosition(pivot.matrixWorld);
        bullets.push({ mesh: bullet, dir: vector.multiplyScalar(7) });
        scene.add(bullet);
    }

    // MOVIMENTAÇÃO E ENTRADA
    window.addEventListener('keydown', (e) => {
        if (e.code === 'KeyE') {
            isControlling = !isControlling;
            if (isControlling) {
                renderer.domElement.requestPointerLock();
                document.getElementById('modo').innerText = "MANUAL (TURRET 01)";
                document.getElementById('crosshair').style.display = 'block';
            } else {
                document.exitPointerLock();
                document.getElementById('modo').innerText = "OBSERVADOR";
                document.getElementById('crosshair').style.display = 'none';
            }
        }
    });

    window.addEventListener('mousemove', (e) => {
        if (isControlling && playerBase) {
            // Roda para os lados (Eixo Y)
            playerBase.rotation.y -= e.movementX * 0.003;
            // Roda para cima e baixo (Eixo X do Pivot)
            playerCannon.rotation.x = Math.max(-0.6, Math.min(0.6, playerCannon.rotation.x - e.movementY * 0.003));
        }
    });

    window.addEventListener('mousedown', () => {
        if (isControlling) fire(playerBase, playerCannon);
    });

    // ONDAS DE INIMIGOS
    function spawnWave() {
        if (currentWave >= MEU_JOGO.ondas.length) return;
        const config = MEU_JOGO.ondas[currentWave];
        
        for (let i = 0; i < config.avioes; i++) {
            setTimeout(() => {
                const enemy = new THREE.Mesh(new THREE.BoxGeometry(6, 2, 8), new THREE.MeshPhongMaterial({color: 0xff3300}));
                enemy.position.set(Math.random()*500-250, 40, -600);
                scene.add(enemy);
                enemies.push({ mesh: enemy, speed: config.velocidade });
            }, i * 1200);
        }
        currentWave++;
    }

    function animate() {
        requestAnimationFrame(animate);

        // 1. Mover balas e detetar colisão
        bullets.forEach((b, bi) => {
            b.mesh.position.add(b.dir);
            enemies.forEach((e, ei) => {
                if (b.mesh.position.distanceTo(e.mesh.position) < 12) {
                    scene.remove(e.mesh);
                    enemies.splice(ei, 1);
                }
            });
        });

        // 2. Mover inimigos
        enemies.forEach(e => e.mesh.position.z += e.speed);

        // 3. IA dos Aliados (Olham para o inimigo mais perto)
        scene.traverse(obj => {
            if (obj.userData.isAlly && enemies.length > 0) {
                obj.lookAt(enemies[0].mesh.position);
            }
        });

        // 4. Câmera
        if (isControlling && playerBase) {
            const relativeCam = new THREE.Vector3(0, 12, 30).applyQuaternion(playerBase.quaternion);
            camera.position.copy(playerBase.position).add(relativeCam);
            camera.lookAt(playerBase.position.x, playerBase.position.y + 10, playerBase.position.z - 100);
        } else {
            camera.position.lerp(new THREE.Vector3(120, 100, 150), 0.05);
            camera.lookAt(0, 0, 0);
        }

        if (enemies.length === 0) spawnWave();
        document.getElementById('alvos').innerText = enemies.length;
        renderer.render(scene, camera);
    }
    animate();
</script>
</body>
</html>
