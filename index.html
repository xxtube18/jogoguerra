<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Defesa Litorânea - Visão de Combate</title>
    <style>
        body { margin: 0; overflow: hidden; background: #000; color: #0f0; font-family: 'Courier New', monospace; }
        #hud { position: absolute; top: 20px; left: 20px; border: 1px solid #0f0; padding: 10px; background: rgba(0,20,0,0.8); z-index: 10; }
        #crosshair { position: absolute; top: 50%; left: 50%; width: 20px; height: 20px; border: 2px solid #f00; border-radius: 50%; transform: translate(-50%, -50%); display: none; }
    </style>
</head>
<body>

<div id="hud">
    <div>COMANDO OPERACIONAL</div>
    <hr>
    <div>TRAVAR MOUSE: [TECLA 1]</div>
    <div>ENTRAR/SAIR DA ARMA: [TECLA E]</div>
    <div>MOVIMENTO: [W,A,S,D]</div>
</div>
<div id="crosshair"></div>

<script type="importmap">
    { "imports": { "three": "https://unpkg.com/three@0.160.0/build/three.module.js" } }
</script>

<script type="module">
    import * as THREE from 'three';
    import { GLTFLoader } from 'https://unpkg.com/three@0.160.0/examples/jsm/loaders/GLTFLoader.js';
    import { OBJLoader } from 'https://unpkg.com/three@0.160.0/examples/jsm/loaders/OBJLoader.js';
    import { MTLLoader } from 'https://unpkg.com/three@0.160.0/examples/jsm/loaders/MTLLoader.js';

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x00050a);
    const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 2000);
    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    document.body.appendChild(renderer.domElement);

    scene.add(new THREE.AmbientLight(0xffffff, 0.5));
    const moon = new THREE.DirectionalLight(0xaabbff, 1.5);
    moon.position.set(20, 50, 20);
    scene.add(moon);

    const loader = new GLTFLoader();
    let soldier, mixer, myTurret, firePoint;
    let isOperating = false;
    let keys = {};
    let rotationY = 0; // Rotação horizontal do mouse
    let rotationX = 0; // Rotação vertical do mouse
    let bullets = [];

    // 1. CARREGAR PERSONAGEM
    loader.load('./Military man.glb', (gltf) => {
        soldier = gltf.scene;
        soldier.scale.set(3.5, 3.5, 3.5);
        soldier.position.set(0, -5, 0);
        scene.add(soldier);

        // Ativar Animações (Tira a T-Pose)
        if (gltf.animations.length > 0) {
            mixer = new THREE.AnimationMixer(soldier);
            mixer.clipAction(gltf.animations[0]).play();
        }
    });

    // 2. CARREGAR ARMA
    loader.load('./Missile Turret.glb', (gltf) => {
        myTurret = gltf.scene;
        myTurret.scale.set(4, 4, 4);
        myTurret.position.set(0, -5, -20);
        
        firePoint = new THREE.Group();
        firePoint.position.set(0, 5, -5);
        myTurret.add(firePoint);
        scene.add(myTurret);
    });

    // CONTROLES DE TRAVAMENTO DE MOUSE
    window.addEventListener('keydown', (e) => {
        keys[e.code] = true;
        if (e.key === '1') renderer.domElement.requestPointerLock();
        if (e.code === 'KeyE') {
            isOperating = !isOperating;
            document.getElementById('crosshair').style.display = isOperating ? 'block' : 'none';
        }
    });

    window.addEventListener('keyup', (e) => keys[e.code] = false);

    // MOVIMENTO DO MOUSE (GIRA A VISÃO)
    document.addEventListener('mousemove', (e) => {
        if (document.pointerLockElement === renderer.domElement) {
            rotationY -= e.movementX * 0.002;
            rotationX -= e.movementY * 0.002;
            rotationX = Math.max(-0.5, Math.min(0.5, rotationX)); // Limita o olhar
        }
    });

    // SISTEMA DE TIRO
    window.addEventListener('mousedown', () => {
        if (isOperating && myTurret) {
            const b = new THREE.Mesh(new THREE.SphereGeometry(0.3), new THREE.MeshBasicMaterial({color: 0x00ff00}));
            b.position.setFromMatrixPosition(firePoint.matrixWorld);
            const dir = new THREE.Vector3(0, 0, -1).applyQuaternion(myTurret.quaternion);
            bullets.push({ mesh: b, vel: dir.multiplyScalar(7) });
            scene.add(b);
        }
    });

    const clock = new THREE.Clock();

    function animate() {
        requestAnimationFrame(animate);
        const delta = clock.getDelta();
        if (mixer) mixer.update(delta);

        if (soldier && !isOperating) {
            // Movimentação baseada na rotação do mouse
            if (keys['KeyW']) soldier.translateZ(0.2);
            if (keys['KeyS']) soldier.translateZ(-0.1);
            if (keys['KeyA']) soldier.translateX(0.1);
            if (keys['KeyD']) soldier.translateX(-0.1);

            soldier.rotation.y = rotationY;

            // Câmera Terceira Pessoa (Visão do soldado)
            const camOffset = new THREE.Vector3(4, 15, -25).applyQuaternion(soldier.quaternion);
            camera.position.lerp(soldier.position.clone().add(camOffset), 0.1);
            camera.lookAt(soldier.position.x, soldier.position.y + 10, soldier.position.z);
        }

        if (isOperating && myTurret) {
            myTurret.rotation.y = rotationY;
            // Visão de dentro da arma
            const turretCam = new THREE.Vector3(0, 12, 5).applyMatrix4(myTurret.matrixWorld);
            camera.position.copy(turretCam);
            camera.lookAt(new THREE.Vector3(0, 10 + (rotationX * 50), -100).applyMatrix4(myTurret.matrixWorld));
        }

        // Atualizar Balas
        bullets.forEach((b, i) => {
            b.mesh.position.add(b.vel);
            if(b.mesh.position.length() > 1000) {
                scene.remove(b.mesh);
                bullets.splice(i, 1);
            }
        });

        renderer.render(scene, camera);
    }
    animate();
</script>
</body>
</html>
