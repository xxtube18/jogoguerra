<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Defesa Litorânea - Comando de Operações</title>
    <style>
        body { margin: 0; overflow: hidden; background: #000; color: #0f0; font-family: 'Courier New', monospace; }
        
        /* Tela de Menu */
        #menu {
            position: absolute; width: 100%; height: 100%; background: rgba(0,10,0,0.95);
            display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 100;
        }
        .input-group { margin: 15px; text-align: center; }
        input { background: #000; border: 1px solid #0f0; color: #0f0; padding: 10px; width: 80px; font-size: 1.2em; text-align: center; }
        button { background: #0f0; color: #000; border: none; padding: 15px 40px; cursor: pointer; font-weight: bold; font-size: 1.2em; margin-top: 20px; }
        
        #hud { position: absolute; top: 20px; left: 20px; border: 2px solid #0f0; padding: 15px; background: rgba(0,20,0,0.8); display: none; }
        #crosshair { 
            position: absolute; top: 50%; left: 50%; width: 30px; height: 30px; 
            border: 2px solid #f00; border-radius: 50%; transform: translate(-50%, -50%); 
            display: none; pointer-events: none; z-index: 50;
        }
    </style>
</head>
<body>

<div id="menu">
    <h1>ESTAÇÃO DE DEFESA LITORÂNEA</h1>
    <div class="input-group">
        <label>NÚMERO DE ALIADOS (SOLDADOS):</label><br>
        <input type="number" id="numAliados" value="3" min="1">
    </div>
    <div class="input-group">
        <label>NÚMERO DE INIMIGOS (AERONAVES):</label><br>
        <input type="number" id="numInimigos" value="5" min="1">
    </div>
    <button id="btnIniciar">INICIAR MISSÃO</button>
</div>

<div id="hud">
    <div>SISTEMA: ATIVO</div>
    <hr>
    <div>INIMIGOS ABATIDOS: <span id="score">0</span></div>
    <div>INTEGRIDADE DA BASE: <span id="baseHp">100%</span></div>
    <div style="font-size: 0.8em; margin-top: 10px;">[1] Travar Mouse | [E] Usar Turret</div>
</div>
<div id="crosshair"></div>

<script type="importmap">
    { "imports": { "three": "https://unpkg.com/three@0.160.0/build/three.module.js" } }
</script>

<script type="module">
    import * as THREE from 'three';
    import { GLTFLoader } from 'https://unpkg.com/three@0.160.0/examples/jsm/loaders/GLTFLoader.js';
    import { OBJLoader } from 'https://unpkg.com/three@0.160.0/examples/jsm/loaders/OBJLoader.js';
    import { MTLLoader } from 'https://unpkg.com/three@0.160.0/examples/jsm/loaders/MTLLoader.js';

    let config = { aliados: 3, inimigos: 5 };
    let jogoIniciado = false;
    let score = 0, baseHp = 100;

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x050a15);
    const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 3000);
    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.outputColorSpace = THREE.SRGBColorSpace;
    document.body.appendChild(renderer.domElement);

    // Luzes
    const ambient = new THREE.AmbientLight(0xffffff, 1.0);
    scene.add(ambient);
    const sun = new THREE.DirectionalLight(0xffffff, 2.0);
    sun.position.set(50, 100, 50);
    scene.add(sun);

    // Áudio
    const listener = new THREE.AudioListener();
    camera.add(listener);
    const somTiro = new THREE.Audio(listener);
    const audioLoader = new THREE.AudioLoader();
    audioLoader.load('./shot.mp3', (buffer) => somTiro.setBuffer(buffer));

    const loaderGLB = new GLTFLoader();
    const mtlLoader = new MTLLoader();
    const objLoader = new OBJLoader();

    let arma, pontoTiro, operando = false, disparando = false;
    let yaw = 0, pitch = 0;
    let inimigos = [], aliados = [], balas = [], misseisInimigos = [], teclas = {};

    // Iniciar Jogo
    document.getElementById('btnIniciar').addEventListener('click', () => {
        config.aliados = parseInt(document.getElementById('numAliados').value);
        config.inimigos = parseInt(document.getElementById('numInimigos').value);
        document.getElementById('menu').style.display = 'none';
        document.getElementById('hud').style.display = 'block';
        jogoIniciado = true;
        carregarCena();
    });

    function carregarCena() {
        // 1. CARREGAR CENÁRIO (OBJ + MTL)
        mtlLoader.load('./stage design.mtl', (materials) => {
            materials.preload();
            objLoader.setMaterials(materials);
            objLoader.load('./stage design.obj', (object) => {
                object.position.set(0, -5, 0);
                object.scale.set(2, 2, 2);
                scene.add(object);
            });
        });

        // 2. CARREGAR TURRET (PLAYER)
        loaderGLB.load('./Missile Turret.glb', (gltf) => {
            arma = gltf.scene;
            arma.position.set(0, 0, 10);
            arma.scale.set(4, 4, 4);
            pontoTiro = new THREE.Group();
            pontoTiro.position.set(0, 5, -10);
            arma.add(pontoTiro);
            scene.add(arma);
        });

        // 3. CARREGAR ALIADOS (MILITARY MAN)
        for(let i=0; i < config.aliados; i++) {
            loaderGLB.load('./Military man.glb', (gltf) => {
                let s = gltf.scene;
                s.position.set(-50 + (i * 20), 0, 30);
                s.scale.set(3.5, 3.5, 3.5);
                scene.add(s);
                aliados.push({ mesh: s, ultimoTiro: 0 });
            });
        }

        // 4. SPAWN INICIAL DE INIMIGOS
        for(let i=0; i < config.inimigos; i++) spawnInimigo();
    }

    function spawnInimigo() {
        const mods = ['./Jet.glb', './Helicopter.glb'];
        loaderGLB.load(mods[Math.floor(Math.random()*2)], (gltf) => {
            let m = gltf.scene;
            m.position.set(Math.random()*800 - 400, 40 + Math.random()*20, -1000 - Math.random()*200);
            m.scale.set(6, 6, 6);
            scene.add(m);
            inimigos.push({ mesh: m, speed: 1.5 + Math.random(), ultimoAtaque: 0 });
        });
    }

    function criarBala(origem, alvoPos = null, ehAliado = false) {
        const b = new THREE.Mesh(
            new THREE.SphereGeometry(0.4), 
            new THREE.MeshBasicMaterial({ color: ehAliado ? 0xffff00 : 0x00ff00 })
        );
        origem.getWorldPosition(b.position);
        
        let dir = new THREE.Vector3();
        if(alvoPos) {
            dir.subVectors(alvoPos, b.position).normalize();
        } else {
            dir.set(0, 0, -1).applyQuaternion(arma.quaternion);
        }

        balas.push({ mesh: b, vel: dir.multiplyScalar(18), ehAliado });
        scene.add(b);

        if(!ehAliado && somTiro.buffer) {
            if(somTiro.isPlaying) somTiro.stop();
            somTiro.play();
        }
    }

    // Controles
    window.addEventListener('keydown', (e) => {
        if(e.key === '1') renderer.domElement.requestPointerLock();
        if(e.code === 'KeyE') {
            operando = !operando;
            document.getElementById('crosshair').style.display = operando ? 'block' : 'none';
        }
    });
    window.addEventListener('mousedown', () => { if(operando) disparando = true; });
    window.addEventListener('mouseup', () => disparando = false);
    document.addEventListener('mousemove', (e) => {
        if (document.pointerLockElement === renderer.domElement) {
            yaw -= e.movementX * 0.002;
            pitch -= e.movementY * 0.002;
            pitch = Math.max(-0.6, Math.min(0.6, pitch));
        }
    });

    function animate() {
        requestAnimationFrame(animate);
        if(!jogoIniciado) return;

        const time = performance.now() * 0.001;

        if(disparando && time % 0.15 < 0.02) criarBala(pontoTiro);

        // Aliados Atirando
        aliados.forEach(ali => {
            if(inimigos.length > 0 && time - ali.ultimoTiro > 2.5) {
                const alvo = inimigos[0].mesh.position;
                ali.mesh.lookAt(alvo);
                criarBala(ali.mesh, alvo, true);
                ali.ultimoTiro = time;
            }
        });

        // Inimigos e Mísseis
        inimigos.forEach((en, i) => {
            en.mesh.position.z += en.speed;
            
            // Atirar Míssil
            if(time - en.ultimoAtaque > 6 && en.mesh.position.z < -200) {
                loaderGLB.load('./Missile.glb', (gltf) => {
                    let mis = gltf.scene;
                    mis.position.copy(en.mesh.position);
                    mis.scale.set(2, 2, 2);
                    mis.lookAt(0, 0, 100);
                    misseisInimigos.push({ mesh: mis, vel: new THREE.Vector3(0, -0.05, 3.0) });
                    scene.add(mis);
                });
                en.ultimoAtaque = time;
            }
            if(en.mesh.position.z > 200) en.mesh.position.z = -1000;
        });

        // Atualizar Mísseis
        misseisInimigos.forEach((m, i) => {
            m.mesh.position.add(m.vel);
            if(m.mesh.position.z > 10) {
                baseHp -= 10;
                document.getElementById('baseHp').innerText = baseHp + "%";
                scene.remove(m.mesh);
                misseisInimigos.splice(i, 1);
            }
        });

        // Balas e Colisões
        balas.forEach((b, bi) => {
            b.mesh.position.add(b.vel);
            
            // Contra Aviões
            inimigos.forEach(en => {
                if(b.mesh.position.distanceTo(en.mesh.position) < 15) {
                    en.mesh.position.z = -1000;
                    score += 100;
                    document.getElementById('score').innerText = score;
                }
            });

            // Contra Mísseis (Sua prioridade)
            misseisInimigos.forEach((mi, miIdx) => {
                if(b.mesh.position.distanceTo(mi.mesh.position) < 10) {
                    scene.remove(mi.mesh);
                    misseisInimigos.splice(miIdx, 1);
                    score += 50;
                    document.getElementById('score').innerText = score;
                }
            });
        });

        if(operando && arma) {
            arma.rotation.y = yaw;
            arma.rotation.x = pitch;
            camera.position.copy(new THREE.Vector3(0, 15, 15).applyMatrix4(arma.matrixWorld));
            camera.lookAt(new THREE.Vector3(0, 10, -200).applyMatrix4(arma.matrixWorld));
        }

        renderer.render(scene, camera);
    }
    animate();
</script>
</body>
</html>
