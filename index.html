<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Defesa Litorânea - Elite Combat</title>
    <style>
        body { margin: 0; overflow: hidden; background: #000; color: #0f0; font-family: monospace; }
        #hud { position: absolute; top: 20px; left: 20px; border: 2px solid #0f0; padding: 15px; background: rgba(0,20,0,0.8); z-index: 10; }
        #crosshair { 
            position: absolute; top: 50%; left: 50%; width: 25px; height: 25px; 
            border: 2px solid #f00; border-radius: 50%; transform: translate(-50%, -50%); 
            display: none; pointer-events: none;
        }
    </style>
</head>
<body>

<div id="hud">
    <div>ESTADO: DEFESA ATIVA</div>
    <hr>
    <div>TRAVAR MOUSE: [1] | ENTRAR NA TURRET: [E]</div>
    <div>MOVIMENTAÇÃO: [W,A,S,D] | DISPARAR: [CLIQUE]</div>
    <div>SCORE: <span id="score">0</span></div>
</div>
<div id="crosshair"></div>

<script type="importmap">
    { "imports": { "three": "https://unpkg.com/three@0.160.0/build/three.module.js" } }
</script>

<script type="module">
    import * as THREE from 'three';
    import { GLTFLoader } from 'https://unpkg.com/three@0.160.0/examples/jsm/loaders/GLTFLoader.js';

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x02050a);

    const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 2000);
    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    
    // --- CONFIGURAÇÃO PARA AS TEXTURAS APARECEREM ---
    renderer.outputColorSpace = THREE.SRGBColorSpace;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.2;
    document.body.appendChild(renderer.domElement);

    // --- ILUMINAÇÃO (Essencial para as texturas dos GLBs) ---
    const light = new THREE.AmbientLight(0xffffff, 1.5); 
    scene.add(light);
    const sun = new THREE.DirectionalLight(0xffffff, 2.5);
    sun.position.set(10, 20, 10);
    scene.add(sun);

    const loader = new GLTFLoader();
    let soldado, arma, pontoTiro, mixer;
    let operando = false, disparando = false;
    let yaw = 0, pitch = 0, score = 0;
    let inimigos = [], balas = [], teclas = {};

    // 1. Carregar Soldado
    loader.load('./Military man.glb', (gltf) => {
        soldado = gltf.scene;
        soldado.scale.set(3.5, 3.5, 3.5);
        soldado.position.set(0, -5, 0);
        scene.add(soldado);
        if(gltf.animations.length > 0) {
            mixer = new THREE.AnimationMixer(soldado);
            mixer.clipAction(gltf.animations[0]).play();
        }
    });

    // 2. Carregar Turret (Missile Turret.glb)
    loader.load('./Missile Turret.glb', (gltf) => {
        arma = gltf.scene;
        arma.scale.set(4, 4, 4);
        arma.position.set(0, -5, -15);
        pontoTiro = new THREE.Group();
        pontoTiro.position.set(0, 5, -10); // Ajuste conforme o modelo
        arma.add(pontoTiro);
        scene.add(arma);
    });

    // 3. Sistema de IA com seus modelos (Jet e Helicopter)
    function spawnInimigo() {
        const modelos = ['./Jet.glb', './Helicopter.glb'];
        const modeloSorteado = modelos[Math.floor(Math.random() * modelos.length)];
        
        loader.load(modeloSorteado, (gltf) => {
            const mesh = gltf.scene;
            mesh.position.set(Math.random() * 600 - 300, 20 + Math.random() * 20, -800);
            mesh.scale.set(6, 6, 6);
            scene.add(mesh);
            inimigos.push({ mesh: mesh, speed: 1.5 + Math.random() });
        });
    }
    for(let i=0; i<5; i++) spawnInimigo();

    // 4. Lógica de Disparo
    function disparar() {
        if (!operando || !arma) return;
        const b = new THREE.Mesh(
            new THREE.SphereGeometry(0.5), 
            new THREE.MeshBasicMaterial({ color: 0x00ff00 })
        );
        const posMatriz = new THREE.Vector3();
        pontoTiro.getWorldPosition(posMatriz);
        b.position.copy(posMatriz);
        
        const dir = new THREE.Vector3(0, 0, -1).applyQuaternion(arma.quaternion);
        balas.push({ mesh: b, vel: dir.multiplyScalar(15) });
        scene.add(b);
    }

    // Controles
    window.addEventListener('keydown', (e) => {
        if (e.key === '1') renderer.domElement.requestPointerLock();
        if (e.code === 'KeyE') {
            operando = !operando;
            document.getElementById('crosshair').style.display = operando ? 'block' : 'none';
        }
        teclas[e.code] = true;
    });
    window.addEventListener('keyup', (e) => teclas[e.code] = false);
    window.addEventListener('mousedown', () => disparando = true);
    window.addEventListener('mouseup', () => disparando = false);
    document.addEventListener('mousemove', (e) => {
        if (document.pointerLockElement === renderer.domElement) {
            yaw -= e.movementX * 0.002;
            pitch -= e.movementY * 0.002;
            pitch = Math.max(-0.5, Math.min(0.5, pitch));
        }
    });

    function animate() {
        requestAnimationFrame(animate);
        const delta = 0.016;
        if (mixer) mixer.update(delta);

        if (disparando && Math.random() > 0.8) disparar();

        // Movimento do Soldado (Livre)
        if (soldado && !operando) {
            soldado.rotation.y = yaw;
            if (teclas['KeyW']) soldado.translateZ(0.3);
            if (teclas['KeyS']) soldado.translateZ(-0.2);
            camera.position.lerp(new THREE.Vector3(soldado.position.x, soldado.position.y + 12, soldado.position.z + 25), 0.1);
            camera.lookAt(soldado.position);
        }

        // Controle da Turret
        if (operando && arma) {
            arma.rotation.y = yaw;
            arma.rotation.x = pitch; // Inclinação da arma
            camera.position.copy(new THREE.Vector3(0, 15, 8).applyMatrix4(arma.matrixWorld));
            camera.lookAt(new THREE.Vector3(0, 10, -100).applyMatrix4(arma.matrixWorld));
        }

        // Atualizar Balas
        balas.forEach((b, i) => {
            b.mesh.position.add(b.vel);
            if (b.mesh.position.z < -1000) {
                scene.remove(b.mesh);
                balas.splice(i, 1);
            }
        });

        // Atualizar Inimigos e Colisão
        inimigos.forEach((en, ei) => {
            en.mesh.position.z += en.speed;
            
            // Checar colisão com balas
            balas.forEach((b, bi) => {
                if (b.mesh.position.distanceTo(en.mesh.position) < 15) {
                    en.mesh.position.z = -800; // Reset inimigo
                    en.mesh.position.x = Math.random() * 600 - 300;
                    scene.remove(b.mesh);
                    balas.splice(bi, 1);
                    score++;
                    document.getElementById('score').innerText = score;
                }
            });

            if (en.mesh.position.z > 50) en.mesh.position.z = -800;
        });

        renderer.render(scene, camera);
    }
    animate();
</script>
</body>
</html>
